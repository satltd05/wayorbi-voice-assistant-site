<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Squircle Gradient (Blue to Violet/Purple) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C91FE" />
      <stop offset="50%" stop-color="#6F7DFE" />
      <stop offset="100%" stop-color="#B46BFE" />
    </linearGradient>

    <!-- Globe Ocean Gradient -->
    <radialGradient id="globeOcean" cx="40%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#4F95FF" />
      <stop offset="45%" stop-color="#2563EB" />
      <stop offset="85%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </radialGradient>

    <!-- Globe Inner Specular Highlight -->
    <radialGradient id="globeHighlight" cx="35%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#93C5FD" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1E3A8A" stop-opacity="0" />
    </radialGradient>

    <!-- Continents Gradient -->
    <linearGradient id="continentGrad" x1="20%" y1="20%" x2="80%" y2="80%">
      <stop offset="0%" stop-color="#93C5FD" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#60A5FA" stop-opacity="0.75" />
    </linearGradient>

    <!-- Orbit Ring Gradient -->
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E0F2FE" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#DDD6FE" stop-opacity="0.7" />
    </linearGradient>

    <!-- Airplane 3D Shading -->
    <linearGradient id="planeBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="55%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="planeWingShade" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowApp" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#4C91FE" flood-opacity="0.35" />
    </filter>

    <filter id="planeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-10" dy="14" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.4" />
    </filter>

    <filter id="orbitGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Squircle Base with Soft Shadow -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="url(#bgGrad)" filter="url(#shadowApp)" />
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />

  <!-- Background Orbit (Behind globe) -->
  <path d="M 125 315 C 80 290 85 240 145 230 C 190 222 250 232 300 248" 
        fill="none" stroke="url(#orbitGrad)" stroke-width="14" stroke-linecap="round" opacity="0.65" />

  <!-- Globe Outer Glow / Atmosphere -->
  <circle cx="256" cy="256" r="148" fill="none" stroke="rgba(191,219,254,0.3)" stroke-width="6" />
  
  <!-- Globe Sphere -->
  <circle cx="256" cy="256" r="144" fill="url(#globeOcean)" />
  
  <!-- Continents Map Shapes -->
  <g fill="url(#continentGrad)" opacity="0.9">
    <!-- North America & Greenland -->
    <path d="M 195 155 C 215 150 245 155 250 170 C 255 185 235 200 225 210 C 215 220 205 235 185 230 C 170 225 160 210 165 195 C 170 175 180 160 195 155 Z" />
    <!-- South America -->
    <path d="M 195 245 C 215 245 230 260 225 285 C 220 310 205 340 190 355 C 180 350 175 325 180 300 C 185 275 180 250 195 245 Z" />
    <!-- Europe & Africa hints -->
    <path d="M 280 165 C 295 160 320 170 315 185 C 310 200 295 205 285 195 Z" />
    <path d="M 275 215 C 295 210 325 230 330 265 C 335 305 315 345 295 350 C 285 345 280 315 285 280 C 290 250 270 230 275 215 Z" />
  </g>

  <!-- Globe Highlight & 3D Shading -->
  <circle cx="256" cy="256" r="144" fill="url(#globeHighlight)" />

  <!-- Front Orbit Swoop (Sweeping around globe front) -->
  <path d="M 95 280 C 110 320 160 345 240 330 C 310 318 365 275 415 230" 
        fill="none" stroke="url(#orbitGrad)" stroke-width="16" stroke-linecap="round" filter="url(#orbitGlow)" />
  <path d="M 95 280 C 110 320 160 345 240 330 C 310 318 365 275 415 230" 
        fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" />

  <!-- 3D White Jet Airplane -->
  <g transform="translate(325, 230) rotate(-42)" filter="url(#planeShadow)">
    <!-- Main Fuselage -->
    <path d="M 0 -85 C 10 -60 14 -10 14 60 C 14 78 7 85 0 88 C -7 85 -14 78 -14 60 C -14 -10 -10 -60 0 -85 Z" 
          fill="url(#planeBodyGrad)" />
    
    <!-- Fuselage Top Highlight Strip -->
    <path d="M 0 -82 C 4 -60 5 -10 5 60 C 5 75 2 82 0 85 C -2 82 -5 75 -5 60 C -5 -10 -4 -60 0 -82 Z" 
          fill="#FFFFFF" opacity="0.7" />

    <!-- Left Main Wing -->
    <path d="M -12 -10 L -95 20 C -102 24 -98 32 -90 32 L -14 22 Z" 
          fill="url(#planeWingShade)" />
    <!-- Right Main Wing -->
    <path d="M 12 -10 L 95 20 C 102 24 98 32 90 32 L 14 22 Z" 
          fill="url(#planeBodyGrad)" />

    <!-- Tail Wings (Stabilizers) -->
    <path d="M -8 55 L -42 74 C -46 76 -44 80 -40 80 L -8 72 Z" 
          fill="url(#planeWingShade)" />
    <path d="M 8 55 L 42 74 C 46 76 44 80 40 80 L 8 72 Z" 
          fill="url(#planeBodyGrad)" />

    <!-- Vertical Tail Fin -->
    <path d="M 0 45 L 0 78 C 3 82 4 82 4 75 L 2 45 Z" 
          fill="#FFFFFF" />
  </g>
</svg>
